name: Animate contributions
on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: snake
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: juliangonzalez-tech
          outputs: |
            dist/github-snake.svg?color_snake=#0e9f95&color_dots=#ebf5f4,#a1d8d5,#67b7b1,#348f91,#1f596b
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#54e2d1&color_dots=#142332,#23515b,#297f83,#35b5ac,#87eee0
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
