name: Profile graphics

# Regenerates the live visuals used by README.md and publishes them to the
# `generated` branch as one force-pushed commit (no history growth).
# Third-party components are pinned to exact commits. See THIRD_PARTY_NOTICES.md.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-graphics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out this repository
        uses: actions/checkout@v7

      - name: Check out the generated branch
        uses: actions/checkout@v7
        with:
          ref: generated
          path: out

      # Arcade games over the contribution calendar (abozanona/pacman-contribution-graph).
      - name: Arcade contribution graphs
        continue-on-error: true
        uses: abozanona/pacman-contribution-graph@294c47eff28a41339a279107ae771b5fa020037a
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman

      # 3D contribution calendar (yoshi389111/github-profile-3d-contrib, v0.9.3).
      - name: 3D contribution graph
        continue-on-error: true
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d/settings.json

      # Statistics cards from the maintained successor of anuraghazra/github-readme-stats
      # (stats-organization/github-readme-stats-action v2.1.0, MIT).
      - name: Statistics card
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&hide=prs,issues,contribs&include_all_commits=true&card_width=390&bg_color=0b1020&title_color=22d3ee&text_color=cbd5e1&icon_color=8b5cf6&border_color=1e293b&hide_border=true
          path: stats-out/stats.svg
          core_version: 2.2.1
          fail_on_error: true
          # Repo-scoped token: it can only read public data, so private repositories are never included.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=donut&langs_count=6&exclude_repo=signal-lab,${{ github.repository_owner }}&bg_color=0b1020&title_color=22d3ee&text_color=cbd5e1&icon_color=8b5cf6&border_color=1e293b&hide_border=true
          path: stats-out/langs.svg
          core_version: 2.2.1
          fail_on_error: true
          # Repo-scoped token: it can only read public data, so private repositories are never included.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Repository card (notcooked)
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=notcooked&description_lines_count=2&bg_color=0b1020&title_color=22d3ee&text_color=cbd5e1&icon_color=8b5cf6&border_color=1e293b&hide_border=true
          path: stats-out/pin-notcooked.svg
          core_version: 2.2.1
          fail_on_error: true
          # Repo-scoped token: it can only read public data, so private repositories are never included.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Repository card (signalquarry)
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=signalquarry&description_lines_count=2&bg_color=0b1020&title_color=22d3ee&text_color=cbd5e1&icon_color=8b5cf6&border_color=1e293b&hide_border=true
          path: stats-out/pin-signalquarry.svg
          core_version: 2.2.1
          fail_on_error: true
          # Repo-scoped token: it can only read public data, so private repositories are never included.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Repository card (cipherscore)
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=cipherscore&description_lines_count=2&bg_color=0b1020&title_color=22d3ee&text_color=cbd5e1&icon_color=8b5cf6&border_color=1e293b&hide_border=true
          path: stats-out/pin-cipherscore.svg
          core_version: 2.2.1
          fail_on_error: true
          # Repo-scoped token: it can only read public data, so private repositories are never included.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect generated files
        run: |
          shopt -s nullglob
          # Only successfully generated files overwrite the previous ones.
          for f in dist/*.svg profile-3d-contrib/*.svg stats-out/*.svg; do cp "$f" out/; done
          echo "Files now on the generated branch:"
          ls -la out | grep -v "^total"

      - name: Publish to the generated branch
        working-directory: out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan publish
          git add -A
          git commit -q -m "Update generated profile graphics"
          git push --force origin publish:generated
