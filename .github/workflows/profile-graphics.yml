name: Profile graphics

# Regenerates the Pac-Man contribution graph used by README.md and publishes it to the
# `generated` branch as one force-pushed commit (no history growth).
# The 3D contribution graph is still generated but is not shown; docs/restore-3d.md explains how to bring it back.
# Third-party components are pinned to exact commits. See THIRD_PARTY_NOTICES.md.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-graphics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out this repository
        uses: actions/checkout@v7

      - name: Check out the generated branch
        uses: actions/checkout@v7
        with:
          ref: generated
          path: out

      # Arcade games over the contribution calendar (abozanona/pacman-contribution-graph).
      - name: Arcade contribution graphs
        continue-on-error: true
        uses: abozanona/pacman-contribution-graph@294c47eff28a41339a279107ae771b5fa020037a
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman

      # 3D contribution calendar (yoshi389111/github-profile-3d-contrib, v0.9.3). Preserved, not currently displayed.
      - name: 3D contribution graph
        continue-on-error: true
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d/settings.json

      - name: Collect generated files
        run: |
          shopt -s nullglob
          # Only successfully generated files overwrite the previous ones.
          for f in dist/*.svg profile-3d-contrib/*.svg; do cp "$f" out/; done
          # Keep only the files the README (or the preserved 3D view) uses, so stale outputs disappear.
          for f in out/*; do
            case "$(basename "$f")" in
              README.md|pacman-contribution-graph-dark.svg|pacman-contribution-graph.svg|profile-3d-night.svg) ;;
              *) rm -f "$f" ;;
            esac
          done
          echo "Files now on the generated branch:"
          ls -la out | grep -v "^total"

      - name: Publish to the generated branch
        working-directory: out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan publish
          git add -A
          git commit -q -m "Update generated profile graphics"
          git push --force origin publish:generated
