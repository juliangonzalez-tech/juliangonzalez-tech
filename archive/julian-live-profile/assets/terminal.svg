<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 225" role="img" aria-label="Animated terminal greeting for Julian Gonzalez"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#061321"/><stop offset="1" stop-color="#11253a"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="900" height="225" rx="14" fill="url(#bg)" stroke="#1b6e80"/><rect width="900" height="34" rx="14" fill="#152b3d"/><circle cx="22" cy="17" r="5" fill="#ff7086"/><circle cx="39" cy="17" r="5" fill="#f0c86c"/><circle cx="56" cy="17" r="5" fill="#6ee9ae"/><text x="79" y="22" fill="#8daebc" font-family="monospace" font-size="13">julian@signal-lab: ~</text><text x="34" y="85" fill="#80aabb" font-family="monospace" font-size="18">$ whoami</text><text x="34" y="138" fill="#76eddd" font-family="monospace" font-weight="bold" font-size="40" filter="url(#glow)">JULIAN GONZALEZ</text><rect x="34" y="155" width="0" height="2" fill="#6ee4d8"><animate attributeName="width" values="0;835;835" dur="3s" repeatCount="indefinite"/></rect><text x="34" y="190" fill="#a6c3d2" font-family="monospace" font-size="17">AI security / software / research / music</text><rect x="754" y="169" width="10" height="23" fill="#71e4d6"><animate attributeName="opacity" values="1;1;0;0;1" dur="1.2s" repeatCount="indefinite"/></rect></svg>
